<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector Styling</title>
    <style>
        * {
            color: red;
            background-color: yellow;
            font-family: "Times New Roman", serif;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage</h1>
    <p>This is a paragraph with red font color, yellow background, and Times New Roman font family.</p>
    <p>All elements are styled using the universal selector.</p>
</body>
</html>
