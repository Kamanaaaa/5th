<html>
    <head>
        <title>kamana</title>
        <style>
            ul{
                width: 200px;
            }
            .type {
                list-style-type: square;
                list-style-position: inside;
            }
            .image {
                list-style-image: url("ghost.jpg");
                list-style-position: inside;
            }

        </style>
    </head>
    <body>
        <h1>List Styles</h1>
        <ul class="type">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <ul class="image">
            <li>Item 1</li>
           
        </ul>
    </body>
</html>
