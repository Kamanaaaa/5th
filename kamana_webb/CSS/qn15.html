<html>
    <head>
        <title>Document</title>
        <style>
            div{
                padding-bottom: 100px;
                padding-left: 80px;
                padding-right: 30px;
                padding-top: 50px;
                background-color: lightblue;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <h1>Using individual padding properties</h1>
        <div>this div element has a top padding 50px, a right padding 30px, a bottom padding of 100px, and a left padding of 80px.</div>
    </body>
</html>
