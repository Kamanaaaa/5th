<!-- Lab 21: Display a horizontal list of links using CSS display property -->

<html>

<head>
    <title>Horizontal Menu</title>

    <style>
        ul {
            list-style-type: none;   /* Remove bullets */
            padding: 0;
        }

        li {
            display: inline;        /* Make list horizontal */
            margin-right: 20px;
        }

        a {
            text-decoration: underline;
            color: blue;
        }
    </style>
</head>

<body>

    <h2>Display a list of links as a horizontal menu:</h2>

    <ul>
        <li><a href="#">HTML</a></li>
        <li><a href="#">CSS</a></li>
        <li><a href="#">JavaScript</a></li>
    </ul>

</body>

</html>
