<html>
    <head>
        <title> kamana</title>
        <style>
            p::first-letter {
                color: red;
                font-size: 200%;
            }
             h1::first-line {
                color: blue;
                font-size: 50%;
            }
             h1::before {
                
                color: green;
            }
             li::marker {
                
                color: orange;
            }
        </style>
    </head>
    <body>
        <h1>Pseudo Elements Selector</h1>
        <p>This is a paragraph demonstrating the ::first-letter pseudo-element selector.</p>
       
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </body>
</html>
