<!-- Lab 28: Make 3 boxes using position and z-index to overlap -->

<html>

<head>
    <title>Z-Index Example</title>

    <style>
        .container {
            position: relative;
            height: 250px;
            border: 2px solid black;
            margin: 20px;
        }

        .box {
            width: 150px;
            height: 150px;
            position: absolute;
            top: 50px;
            left: 50px;
            opacity: 0.8;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 150px;
        }

        .box1 {
            background: red;
            top: 20px;
            left: 20px;
            z-index: 1;
        }

        .box2 {
            background: green;
            top: 60px;
            left: 60px;
            z-index: 2;
        }

        .box3 {
            background: blue;
            top: 100px;
            left: 100px;
            z-index: 3; /* highest, appears on top */
        }
    </style>
</head>

<body>

    

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>

</body>

</html>
