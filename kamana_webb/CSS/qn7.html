<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-class Demo</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
        }
        a {
             color: blue; 
             text-decoration: none;
             }
        a:hover { color: red; }
        li:first-child {
             background: lightblue;
             }
        input:focus { 
            border: 2px solid blue; 
        }
    </style>
</head>
<body>
    <h1>Pseudo-classes</h1>
    <a href="#">Hover me</a>
    <ul>
        <li>First</li>
        <li>Second</li>
    </ul>
    <input type="text" placeholder="Click me">
</body>
</html>
