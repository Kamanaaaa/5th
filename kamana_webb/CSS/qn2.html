<html>

<head>
    <title>Internal CSS</title>
    <style>
        body {
            background-color: black;
            color: white;
        }

        h2 {
            text-align: center;
            margin: 20px;
        }

        hr {
            border: 2px solid white;
            width: 40%;
            border-radius: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 600px;
            margin: 25px auto;
        }

        p {
            text-align: justify;
        }

        img {
            height: 300px;
            width: 220px;
            border: 3px solid white;
        }
    </style>
</head>

<body>

    <h2>Ghost of Tsushima</h2>
    <hr>

    <div class="container">
        <p>
            Ghost of Tsushima is a 2020 action-adventure game developed by Sucker Punch Productions
            and published by Sony Interactive Entertainment. The player controls Jin Sakai, a samurai
            on a quest to protect Tsushima Island during the first Mongol invasion of Japan.
        </p>
        <img src="ghost.jpg">
    </div>

</body>

</html>
