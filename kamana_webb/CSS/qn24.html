<!-- Lab 24: Make small boxes using HTML and CSS float property -->

<html>

<head>
    <title>Float Boxes</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;
            text-align: center;
            line-height: 100px;
            float: left;      /* Change to right if needed */
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>

</body>

</html>
