<html>
    <head>
        <title>kamana</title>
        <style>
            #normal {
                border: 3px solid blue;
                border-radius: 0px ;
                padding: 10px;
            }
            #round {
                border: 3px solid red;
                border-radius: 15px;
                padding: 10px;
            }
            #rounder {
                border: 3px solid green;
                border-radius: 50px;
                padding: 10px;
            }
            #roundest {
                border: 3px solid orange;
                border-radius: 100px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Border Radius</h1>
        <p id="normal">normal border</p>
        <p id="round">Round border</p>
        <p id="rounder">Rounded border</p>
        <p id="roundest">Roundest border</p>
    </body>

</html>
