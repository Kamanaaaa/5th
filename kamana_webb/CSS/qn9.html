<html>
    <head>
        <title> kamanaa</title>
        <style>
            div p {
                color: red;
                background-color: lightgray;
            }
            div > p {
                color: blue;
                background-color: lightyellow;
            }
            h1 + p {
                color:rgb(8, 39, 39);
                background-color: brown;
            }
            h1 ~ p {
                font-style: italic;
            }
             
        </style>
    </head>
    <body>
        <h1>Combinator selector</h1>
       
        <div>
            <p>descendent selector</p>
            <p>child selecctor</p>
        </div>
       <h1>combinator selectors 2</h1>
       <p>adjacent sibling selector</p>
       <p>general sibling selector</p>
    </body>
</html>
