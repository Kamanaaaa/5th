<html>
<body>
  Roll No: <input type="text" id="roll"><br><br>
  Name: <input type="text" id="name"><br><br>
  Email: <input type="text" id="email"><br><br>
  Phone: <input type="text" id="phone"><br><br>

  <button onclick="check()">Submit</button>
  <p id="msg"></p>

  <script>
    function check() {
      var roll = document.getElementById("roll").value.trim();
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var msg = document.getElementById("msg");

      if (roll == "" || isNaN(roll)) { msg.innerHTML = "Enter valid roll no."; return; }
      if (name == "") { msg.innerHTML = "Name cannot be blank."; return; }
      if (phone == "" || isNaN(phone)) { msg.innerHTML = "Enter valid phone no."; return; }

      var at = email.indexOf("@");
      var dot = email.lastIndexOf(".");
      if (email == "" || at <= 0 || dot <= at + 1 || dot == email.length - 1) {
        msg.innerHTML = "Enter valid email.";
        return;
      }

      msg.innerHTML = "All data are valid!";
    }
  </script>
</body>
</html>
