<!DOCTYPE html>
<html>
<body>
  <h3>Validate User Data</h3>

  <form onsubmit="validate(event)">
    Username: <input type="text" id="username"><br><br>
    Password: <input type="password" id="password"><br><br>
    Phone: <input type="text" id="phone"><br><br>
    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>

  <script>
    function validate(e) {
      e.preventDefault();

      let u = document.getElementById("username").value.trim();
      let p = document.getElementById("password").value;
      let ph = document.getElementById("phone").value.trim();

      if (u === "" || p === "" || ph === "") {
        document.getElementById("msg").innerHTML = "All fields are required.";
        return;
      }

      if (p.length < 6) {
        document.getElementById("msg").innerHTML = "Password must be at least 6 characters.";
        return;
      }

      if (!/^\d{7}$/.test(ph)) {
        document.getElementById("msg").innerHTML = "Phone number must contain exactly 7 digits.";
        return;
      }

      document.getElementById("msg").innerHTML = "Submitted successfully!";
    }
  </script>
</body>
</html>
