<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Validation Form</title>
</head>
<body>
  <h3>Enter String and Number</h3>

  <form onsubmit="checkData(event)">
    <label>String:</label>
    <input type="text" id="str" required />

    <br><br>

    <label>Number:</label>
    <input type="number" id="num" required />

    <br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>

  <script>
    function checkData(e) {
      e.preventDefault();

      let s = document.getElementById("str").value.trim();
      let n = parseInt(document.getElementById("num").value, 10);

      if (s === "JavaScript" && n === 1996) {
        document.getElementById("msg").innerHTML = "Welcome!";
      } else {
        document.getElementById("msg").innerHTML = "Invalid input. Please re-enter string and number.";
        document.getElementById("str").value = "";
        document.getElementById("num").value = "";
        document.getElementById("str").focus();
      }
    }
  </script>
</body>
</html>
