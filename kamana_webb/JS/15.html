<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>String Equality Check</title>
</head>
<body>
  <h2>Check Two Strings Equality</h2>
  <script>
    let str1 = prompt("Enter first string:");
    let str2 = prompt("Enter second string:");
    if (str1 === str2) {
      document.write("Strings are equal.<br>");
      document.write("Uppercase of first string: " + str1.toUpperCase());
    } else {
      document.write("Two strings are not equal.");
    }
  </script>
</body>
</html>
