<!doctype html>
<html>
<head>
  <title>Numbers not divisible by 5</title>
</head>
<body>
<script>
  document.write("Numbers from 1 to 100 (not divisible by 5):<br><br>");
  
  for (let i = 1; i <= 100; i++) {
    if (i % 5 !== 0) {
      document.write(i + " ");
    }
  }
</script>
</body>
</html>
