
<html>
<body>
<script>
  let students = [];

  for (let i = 1; i <= 10; i++) {
    students.push(prompt("Enter name of student " + i + ":"));
  }

  document.write("Array: " + students + "<br>");
  let str = students.toString();
  document.write("String: " + str);
</script>
</body>
</html>
