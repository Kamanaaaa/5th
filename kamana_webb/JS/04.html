<!doctype html>
<html>
<head>
  <title>Change Paragraph Text</title>
  <script>
    function changeText() {
      document.getElementById("para").innerHTML = "BOOM!!! The paragraph text has been changed now!";
    }
  </script>
</head>
<body>
  <p id="para">original text</p>
  <button onclick="changeText()">Change paragraph</button>
</body>
</html>
